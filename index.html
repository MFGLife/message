<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micheal's love for Mercedes broken into science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDE6D6;
    --paper-dark: #E3DAC5;
    --ink: #2E2418;
    --ink-soft: #5A4B3A;
    --forest: #3F5942;
    --rust: #A63D2F;
    --line: #C9BEA4;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background:
      radial-gradient(ellipse at top left, #F1EBDC 0%, var(--paper) 45%, #E4D9C2 100%);
    font-family: 'Lora', serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
  }

  /* faint desk texture */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(46,36,24,0.015) 0px, rgba(46,36,24,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }

  .stage {
    perspective: 1600px;
    width: 100%;
    max-width: 460px;
  }

  .card {
    position: relative;
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 44px 38px 36px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 18px 40px -14px rgba(46, 36, 24, 0.35),
      0 4px 10px -4px rgba(46, 36, 24, 0.25);
    transform: rotate(-0.6deg);
    transition: transform 420ms cubic-bezier(.22,.61,.36,1), opacity 420ms ease;
    transform-style: preserve-3d;
  }

  .card.flipping {
    transform: rotate(-0.6deg) rotateY(90deg);
    opacity: 0;
  }

  .card::before {
    /* stitched border, like an old specimen label */
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px dashed rgba(46,36,24,0.18);
    border-radius: 2px;
    pointer-events: none;
  }

  .eyebrow-row {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 24px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .collection-name {
    font-size: 10.5px;
    letter-spacing: 0.05em;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .catalog-number {
    font-size: 13px;
    color: var(--forest);
    font-weight: 500;
  }

  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--rust);
    border: 1.5px solid var(--rust);
    border-radius: 999px;
    padding: 4px 12px 4px 10px;
    transform: rotate(-2deg);
    margin-bottom: 22px;
    width: fit-content;
  }

  .stamp .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--rust);
  }

  .entry {
    font-size: 21px;
    line-height: 1.55;
    color: var(--ink);
    font-weight: 400;
    min-height: 130px;
    display: flex;
    align-items: center;
  }

  .entry em {
    font-style: italic;
    color: var(--forest);
  }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 28px 0 20px;
    position: relative;
  }

  .footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
  }

  .signed {
    font-size: 11px;
    color: var(--ink-soft);
    font-style: italic;
    font-family: 'Lora', serif;
  }

  button#shuffle {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    background: var(--forest);
    color: var(--paper);
    border: none;
    padding: 11px 18px;
    border-radius: 3px;
    cursor: pointer;
    box-shadow: 0 3px 0 #2c3f2e, 0 6px 10px -4px rgba(46,36,24,0.4);
    transition: transform 120ms ease, box-shadow 120ms ease;
  }

  button#shuffle:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 0 #2c3f2e, 0 8px 14px -4px rgba(46,36,24,0.45);
  }

  button#shuffle:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #2c3f2e, 0 3px 6px -3px rgba(46,36,24,0.4);
  }

  .total {
    margin-top: 18px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
    opacity: 0.75;
  }

  @media (max-width: 420px) {
    .card { padding: 34px 24px 28px; }
    .entry { font-size: 19px; min-height: 150px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card.flipping { transition: none; }
  }
</style>
</head>
<body>

  <div class="stage">

      <div class="entry" id="entryText">Loading observation…</div>

        <button id="shuffle">Another data point</button>

    </div>
    <div class="total" id="totalCount"></div>

  const cardEl = document.getElementById('card');
  const entryEl = document.getElementById('entryText');
  const catalogEl = document.getElementById('catalogNumber');
  const totalEl = document.getElementById('totalCount');
  const shuffleBtn = document.getElementById('shuffle');

  let lastIndex = -1;

  function formatCatalog(n) {
    // true, 1-indexed count — no artificial offset now that the collection is real
    const display = n + 1;
    return 'No. ' + String(display).padStart(3, '0');
  }

  function pickIndex() {
    if (dataPoints.length === 1) return 0;
    let i;
    do {
      i = Math.floor(Math.random() * dataPoints.length);
    } while (i === lastIndex);
    return i;
  }

  function render(index) {
    entryEl.textContent = dataPoints[index];
    catalogEl.textContent = formatCatalog(index);
    totalEl.textContent = dataPoints.length + ' OBSERVATIONS ON FILE, AND COUNTING';
    lastIndex = index;
  }

  function showRandom() {
    cardEl.classList.add('flipping');
    setTimeout(() => {
      render(pickIndex());
      cardEl.classList.remove('flipping');
    }, 220);
  }

  shuffleBtn.addEventListener('click', showRandom);

  // initial load
  render(pickIndex());
</script>

</body>
</html>
